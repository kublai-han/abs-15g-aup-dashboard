name: Keep Site Awake

# Streamlit Community Cloud puts apps to sleep after a stretch without
# visitors. Visiting every 6 hours keeps the site awake with room to spare.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install headless browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visit the site (wake it if asleep)
        run: python keep_alive.py
