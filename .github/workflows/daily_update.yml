name: Daily AUP Database Update

on:
  schedule:
    - cron: '0 22 * * *'   # 5 PM ET (EST = UTC-5); shifts to 6 PM during EDT
  workflow_dispatch:         # allow manual trigger from GitHub Actions UI

permissions:
  contents: write            # needed to push the updated aup_dashboard.db

jobs:
  update-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0     # full history needed to push to other branches

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AUP updater (fetch new filings from EDGAR)
        env:
          EDGAR_USER_AGENT: "AUP Dashboard kennethjhan@gmail.com"
        timeout-minutes: 15
        run: python -c "import aup_updater; aup_updater.update_all_issuers()"

      - name: Post-process new filings (dedup, recount exceptions, fill rates)
        timeout-minutes: 5
        run: python fix_findings_counts.py

      - name: Commit updated database
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions [bot]"
          git add aup_dashboard.db
          if git diff --cached --quiet; then
            echo "No database changes — nothing to commit."
          else
            git commit -m "Daily AUP data update $(date -u +%Y-%m-%d)"
            git push origin main
            git push origin main:sync-to-main
            git push origin main:master
          fi
